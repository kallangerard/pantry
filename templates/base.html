<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>{% block title %}Pantry{% endblock %}</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: system-ui, sans-serif; background: #f5f5f5; color: #222; }
    header { background: #2c7a4b; color: #fff; padding: 1rem 2rem; display: flex; align-items: center; gap: 1rem; }
    header h1 { font-size: 1.4rem; }
    header a { color: #fff; text-decoration: none; }
    main { max-width: 900px; margin: 2rem auto; padding: 0 1rem; }
    h2 { margin-bottom: 1rem; }
    table { width: 100%; border-collapse: collapse; background: #fff; border-radius: 6px; overflow: hidden; box-shadow: 0 1px 3px rgba(0,0,0,.12); }
    th, td { padding: .75rem 1rem; text-align: left; border-bottom: 1px solid #e5e5e5; }
    th { background: #e8f5ee; font-weight: 600; }
    tr:last-child td { border-bottom: none; }
    .btn { display: inline-block; padding: .45rem .9rem; border-radius: 4px; border: none; cursor: pointer; font-size: .9rem; text-decoration: none; }
    .btn-primary { background: #2c7a4b; color: #fff; }
    .btn-secondary { background: #eee; color: #333; }
    .btn-danger { background: #c0392b; color: #fff; }
    .btn + .btn { margin-left: .5rem; }
    .actions { margin-bottom: 1.2rem; }
    form .field { margin-bottom: 1rem; }
    form label { display: block; font-weight: 600; margin-bottom: .3rem; }
    form input[type=text], form textarea, form select { width: 100%; padding: .5rem .75rem; border: 1px solid #ccc; border-radius: 4px; font-size: 1rem; }
    form textarea { min-height: 100px; resize: vertical; }
    .card { background: #fff; border-radius: 6px; box-shadow: 0 1px 3px rgba(0,0,0,.12); padding: 1.5rem; }
    .empty { color: #888; font-style: italic; }
    .messages { list-style: none; margin-bottom: 1rem; }
    .messages li { padding: .6rem 1rem; border-radius: 4px; background: #d4edda; color: #155724; }
  </style>
</head>
<body>
  <header>
    <h1><a href="{% url 'inventory:sku-list' %}">🥫 Pantry</a></h1>
  </header>
  <main>
    {% if messages %}
      <ul class="messages">
        {% for message in messages %}
          <li>{{ message }}</li>
        {% endfor %}
      </ul>
    {% endif %}
    {% block content %}{% endblock %}
  </main>
</body>
</html>
