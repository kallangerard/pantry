{% extends "base.html" %}

{% block title %}Delete {{ object.name }} – Pantry{% endblock %}

{% block content %}
<h2>Delete "{{ object.name }}"</h2>

<div class="card">
  <p>Are you sure you want to delete <strong>{{ object.name }}</strong>? This cannot be undone.</p>
  <br />
  <form method="post">
    {% csrf_token %}
    <button type="submit" class="btn btn-danger">Yes, delete</button>
    <a href="{% url 'inventory:sku-list' %}" class="btn btn-secondary">Cancel</a>
  </form>
</div>
{% endblock %}
